<!doctype html>
<html lang="en">
<head>
    <title>Vehicle Management System</title>
    <style>
        body {
            background: #f7f7f7;
            font-family: Segoe UI, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
        }
        .main-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 40px;
            box-shadow: 0 4px 16px rgba(60,60,60,0.12);
            width: 370px;
            margin-top: 30px;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            color: #1b2430;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        #msg {
            margin-bottom: 22px;
            color: #228b22;
            font-weight: bold;
        }
        form {
            margin-bottom: 18px;
            padding: 18px 0;
            border-top: 1px solid #e0e0ee;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
            text-align: left;
        }
        input {
            width: 90%;
            padding: 7px 9px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-bottom: 13px;
            font-size: 1em;
            background: #fbfbfb;
        }
        button {
            padding: 7px 22px;
            border-radius: 6px;
            background: #2d6cdf;
            color: #fff;
            font-weight: bold;
            font-size: 1em;
            border: none;
            margin-top: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #174ea6;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>Vehicle Management System</h1>
        <!-- Display booking/payment success or failure message -->
        <div id="msg">{{ msg }}</div>
        
        <!-- Booking Form -->
        <form method="post" action="">
            <label for="vehicleid1">Vehicle ID</label>
            <input name="vehicleid" id="vehicleid1" value="1" required>
            <label for="userid">User ID</label>
            <input name="userid" id="userid" value="101" required>
            <button name="action" value="book">Book</button>
        </form>

        <!-- Payment Form -->
        <form method="post" action="">
            <label for="vehicleid2">Vehicle ID</label>
            <input name="vehicleid" id="vehicleid2" value="1" required>
            <label for="amount">Amount</label>
            <input name="amount" id="amount" value="500" required>
            <label for="method">Method</label>
            <input name="method" id="method" value="cash" required>
            <button name="action" value="pay">Pay</button>
        </form>
    </div>
</body>
</html>
